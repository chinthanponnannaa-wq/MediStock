{% extends 'base.html' %} 
{% block title %}Add Supplier – MediStock{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="med-card">
      <div class="med-card-header">
        <h2 class="med-card-title"><i class="fa fa-user-plus text-primary mr-2"></i> Add New Supplier / Vendor</h2>
        <a href="{% url 'newsupply' %}" class="btn btn-sm btn-outline-secondary">View Suppliers</a>
      </div>

      <form method="POST" action="{% url 'addvendor' %}">
        {% csrf_token %}

        <div class="form-group">
          <label for="vendorname" class="font-weight-semibold">Supplier Company Name <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="vendorname" placeholder="e.g. Acme Pharmaceuticals Ltd" name="name" required>
        </div>

        <div class="form-group">
          <label for="address" class="font-weight-semibold">Office / Warehouse Address <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="address" placeholder="Full street address, city, state" name="address" required>
        </div>

        <div class="form-row">
          <div class="form-group col-md-6">
            <label for="phone" class="font-weight-semibold">Phone Number <span class="text-danger">*</span></label>
            <input type="tel" class="form-control" id="phone" placeholder="e.g. 9876543210" name="phone" required>
          </div>
          <div class="form-group col-md-6">
            <label for="email" class="font-weight-semibold">Email Address <span class="text-danger">*</span></label>
            <input type="email" class="form-control" id="email" placeholder="contact@supplier.com" name="email" required>
          </div>
        </div>

        <div class="mt-4 text-right">
          <a href="{% url 'home' %}" class="btn btn-secondary mr-2">Cancel</a>
          <button type="submit" class="btn btn-primary-med">
            <i class="fa fa-plus-circle mr-1"></i> Save Supplier
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
