{% extends 'base.html' %} 
{% block title %}Revenue Analysis Report – MediStock{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="med-card">
      <div class="med-card-header">
        <h2 class="med-card-title"><i class="fa fa-money text-primary mr-2"></i> Revenue Analysis Report</h2>
      </div>

      <p class="text-muted small mb-4">Select a start date and end date to calculate sales revenue, vendor costs, and net profit for the specified period.</p>

      <form method="POST" action="{% url 'revenue' %}">
        {% csrf_token %}

        <div class="form-group">
          <label for="start_date" class="font-weight-semibold">Start Date <span class="text-danger">*</span></label>
          <input type="date" class="form-control" id="start_date" name="start_date" required />
        </div>

        <div class="form-group mb-4">
          <label for="end_date" class="font-weight-semibold">End Date <span class="text-danger">*</span></label>
          <input type="date" class="form-control" id="end_date" name="end_date" required />
        </div>

        <div class="text-right">
          <button type="submit" class="btn btn-primary-med btn-block">
            <i class="fa fa-calculator mr-1"></i> Calculate Revenue & Profit
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
