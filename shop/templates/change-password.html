{% extends 'base.html' %} 
{% block title %}Change Password – MediStock{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="med-card">
      <div class="med-card-header">
        <h2 class="med-card-title"><i class="fa fa-key text-primary mr-2"></i> Change Account Password</h2>
      </div>

      <form method="POST">
        {% csrf_token %}

        <div class="form-group">
          <label for="old_password" class="font-weight-semibold">Current Password <span class="text-danger">*</span></label>
          <input type="password" class="form-control" id="old_password" placeholder="Enter current password" name="old_password" required>
        </div>

        <div class="form-group">
          <label for="new_password1" class="font-weight-semibold">New Password <span class="text-danger">*</span></label>
          <input type="password" class="form-control" id="new_password1" placeholder="Enter new password" name="new_password1" required>
        </div>

        <div class="form-group mb-4">
          <label for="new_password2" class="font-weight-semibold">Confirm New Password <span class="text-danger">*</span></label>
          <input type="password" class="form-control" id="new_password2" placeholder="Re-enter new password" name="new_password2" required>
        </div>

        <div class="text-right">
          <a href="{% url 'home' %}" class="btn btn-secondary mr-2">Cancel</a>
          <button type="submit" class="btn btn-primary-med">
            <i class="fa fa-save mr-1"></i> Update Password
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
